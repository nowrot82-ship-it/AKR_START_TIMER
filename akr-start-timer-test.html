<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101010"><title>AKR START TIMER — TEST</title>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#101010}*{box-sizing:border-box}body{margin:0}.app{min-height:100dvh;padding:clamp(10px,2vw,24px);display:flex;flex-direction:column;gap:12px;max-width:1400px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:clamp(17px,2.6vw,30px);font-weight:900;letter-spacing:.06em}.brand b{color:#f34242}.tag{font-size:clamp(10px,1.3vw,14px);color:#aaa}.stage{flex:1;min-height:220px;display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.clock,.lamp{background:#222;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;padding:12px}.clock .hint{color:#aaa;font-size:clamp(12px,1.8vw,22px);font-weight:bold}.digits{font-variant-numeric:tabular-nums;font-weight:900;line-height:1.05;letter-spacing:-.045em;font-size:clamp(52px,10vw,158px);white-space:nowrap}.digits.time{font-size:clamp(36px,7.1vw,105px)}.sub{color:#bbb;font-size:clamp(13px,1.8vw,20px);margin-top:10px}.lamp{background:#b51414;transition:background .12s}.lamp.green{background:#008c35}.lamp .light{width:clamp(60px,10vw,130px);aspect-ratio:1;border-radius:50%;background:#ff5656;box-shadow:0 0 40px #ff4242aa;margin-bottom:12px}.lamp.green .light{background:#4cff82;box-shadow:0 0 45px #5aff85}.signal{font-size:clamp(30px,5vw,68px);font-weight:900}.controls{display:flex;align-items:stretch;gap:10px}.controls input{width:38%;min-width:0;font-size:clamp(22px,3vw,34px);font-weight:bold;border:2px solid #555;border-radius:12px;background:#252525;color:white;padding:12px}.controls button,.history button{border:0;border-radius:12px;padding:12px 20px;font-weight:900;font-size:clamp(17px,2.5vw,27px);cursor:pointer}.start{flex:1;background:#f43f3f;color:#fff}.start:disabled{opacity:.35;cursor:not-allowed}.historyToggle{background:#383838;color:#fff}.foot{display:flex;justify-content:space-between;gap:12px;color:#bbb;font-size:13px;flex-wrap:wrap}.history{display:none;background:#202020;padding:14px;border-radius:14px;max-height:35vh;overflow:auto}.history.open{display:block}.history h2{margin:0 0 8px;font-size:20px}.history table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}.history td,.history th{padding:8px;border-bottom:1px solid #444;text-align:left}.history button{font-size:14px;background:#555;color:white;margin-top:10px}.status{color:#f9d28b}@media(max-width:620px) and (orientation:portrait){.stage{grid-template-columns:1fr;grid-template-rows:1fr 1fr}.digits{font-size:clamp(70px,21vw,130px)}.digits.time{font-size:clamp(40px,12vw,82px)}.lamp .light{width:70px}.controls{flex-wrap:wrap}.controls input{width:100%}.controls button{flex:1}.app{min-height:100dvh}}@media(max-height:470px) and (orientation:landscape){.app{gap:6px;padding:7px 12px}.stage{min-height:120px;gap:8px}.lamp .light{width:48px;margin-bottom:3px}.signal{font-size:29px}.controls input,.controls button{padding:7px}.sub{margin-top:2px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">AKR <b>START</b> TIMER</div><div class="tag">KJS CHRONO SYSTEM · WERSJA TESTOWA</div></div><div class="tag" id="mode">GOTOWOŚĆ</div></header><section class="stage"><div class="clock"><div class="hint" id="clockLabel">AKTUALNY CZAS</div><div class="digits time" id="display">--:--:--</div><div class="sub" id="crewInfo">Oczekiwanie na załogę</div></div><div class="lamp" id="lamp"><div class="light"></div><div class="signal" id="signal">CZEKAJ</div></div></section><section class="controls" id="controls"><input id="crew" type="text" inputmode="numeric" autocomplete="off" placeholder="NR ZAŁOGI" aria-label="Numer załogi" maxlength="8"><button class="start" id="start">START · 30 s</button><button class="historyToggle" id="historyToggle">HISTORIA</button></section><div class="foot"><span class="status" id="status">Zapis lokalny · bez połączenia z arkuszem</span><span id="count">Zapisane starty: 0</span></div><section class="history" id="history"><h2>Historia startów (lokalna)</h2><table><thead><tr><th>Załoga</th><th>Data</th><th>Czas startu</th></tr></thead><tbody id="rows"></tbody></table><button id="export">Eksport CSV</button> <button id="clear">Usuń historię</button></section></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='akr_start_timer_test_v1';let state='idle',deadline=0,startEpoch=0,greenUntil=0,crewNumber='',frame=0;const pad=(n,l=2)=>String(n).padStart(l,'0');const formatTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;const formatPrecise=d=>`${formatTime(d)}.${pad(d.getMilliseconds(),3)}`;function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function store(rows){try{localStorage.setItem(KEY,JSON.stringify(rows));return true}catch{return false}}function renderHistory(){const rows=load();$('count').textContent=`Zapisane starty: ${rows.length}`;$('rows').replaceChildren();for(const r of rows.slice().reverse()){$('rows').insertAdjacentHTML('beforeend',`<tr><td>${escapeHTML(r.crew)}</td><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.time)}</td></tr>`)}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function lamp(green){$('lamp').classList.toggle('green',green);$('signal').textContent=green?'START':'CZEKAJ'}function idle(){state='idle';lamp(false);$('mode').textContent='GOTOWOŚĆ';$('clockLabel').textContent='AKTUALNY CZAS';$('display').classList.add('time');$('crewInfo').textContent='Oczekiwanie na załogę';$('crew').value='';$('crew').disabled=false;$('start').disabled=false;$('historyToggle').disabled=false;$('history').classList.remove('open');$('history').style.display='';$('status').textContent='Zapis lokalny · bez połączenia z arkuszem'}function saveStart(){const d=new Date(startEpoch);const r={crew:crewNumber,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,time:formatPrecise(d),timestamp:d.toISOString()};const rows=load();rows.push(r);const ok=store(rows);renderHistory();$('status').textContent=ok?`Zapisano lokalnie: załoga ${crewNumber} · ${r.time}`:'UWAGA: nie udało się zapisać lokalnie!'}function tick(){const now=performance.now();if(state==='idle'){$('display').textContent=formatTime(new Date())}else if(state==='countdown'){const remaining=deadline-now;if(remaining<=0){state='green';greenUntil=deadline+3000;lamp(true);$('mode').textContent='START!';$('display').textContent='00';$('clockLabel').textContent='START';saveStart()}else{$('display').textContent=pad(Math.ceil(remaining/1000))}}else if(state==='green'&&now>=greenUntil){idle()}frame=requestAnimationFrame(tick)}$('start').addEventListener('click',()=>{if(state!=='idle')return;const nr=$('crew').value.trim();if(!/^[0-9]{1,8}$/.test(nr)){alert('Wpisz numer startowy załogi (cyfry).');return}crewNumber=nr;const nowPerf=performance.now();deadline=nowPerf+30000;startEpoch=Date.now()+30000;state='countdown';$('display').classList.remove('time');$('clockLabel').textContent='START ZA';$('crewInfo').textContent=`ZAŁOGA NR ${nr}`;$('mode').textContent='ODLICZANIE';$('crew').disabled=true;$('start').disabled=true;$('historyToggle').disabled=true;$('history').classList.remove('open');lamp(false)});$('historyToggle').addEventListener('click',()=>{$('history').classList.toggle('open');renderHistory()});$('export').addEventListener('click',()=>{const rows=load();const csv='\ufeffNumer załogi;Data;Czas startu;ISO\r\n'+rows.map(r=>`${r.crew};${r.date};${r.time};${r.timestamp}`).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='akr-start-timer-test.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('clear').addEventListener('click',()=>{if(confirm('Usunąć całą lokalną historię startów?')){store([]);renderHistory()}});window.addEventListener('beforeunload',e=>{if(state==='countdown'){e.preventDefault();e.returnValue=''}});renderHistory();tick()})();
</script></body></html>
