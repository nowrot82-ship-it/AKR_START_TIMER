<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><title>AKR START TIMER — TEST v2</title><style>
:root{font-family:Arial,Helvetica,sans-serif;color:#fff;background:#08090b}*{box-sizing:border-box}body{margin:0}.app{min-height:100dvh;max-width:1400px;margin:auto;padding:clamp(10px,2vw,22px);display:flex;flex-direction:column;gap:clamp(8px,1.4vh,16px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:clamp(24px,4.5vw,54px);font-weight:1000;font-style:italic;letter-spacing:-.035em;line-height:1.05;text-shadow:0 2px 5px #000}.brand b{color:#f0252d}.tag{font-size:clamp(10px,1.5vw,17px);color:#a7a7a7;letter-spacing:.035em}.flag{font-size:clamp(25px,5vw,65px);font-weight:900;opacity:.85;letter-spacing:-.12em;color:#eee;transform:skew(-14deg)}
.stage{flex:1;min-height:260px;display:flex}.panel{width:100%;border-radius:clamp(20px,3vw,36px);border:2px solid #ff3333;background:radial-gradient(ellipse at 50% 55%,#c91116 0%,#970000 52%,#610000 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(5px,1.4vh,20px);padding:clamp(12px,2vw,26px);transition:background .16s,border-color .16s;overflow:hidden}.panel.green{background:radial-gradient(ellipse at 50% 55%,#10ae2c 0%,#04761a 55%,#003c0c 100%);border-color:#1ef447}
.hint{font-weight:800;font-size:clamp(17px,2.8vw,34px);color:#f3dada;text-align:center}.digits{font-weight:1000;font-variant-numeric:tabular-nums;letter-spacing:-.065em;line-height:.98;white-space:nowrap;text-align:center;font-size:clamp(145px,32vh,440px);text-shadow:0 5px 18px #0003}.digits.time{font-size:clamp(57px,13.4vw,220px)}.light{width:clamp(40px,8vh,105px);aspect-ratio:1;border-radius:50%;background:#ff5353;box-shadow:0 0 40px #ff505099;border:3px solid #b30c0c}.panel.green .light{background:#38ff52;box-shadow:0 0 40px #3cff4faa;border-color:#038e1d}.signal{font-size:clamp(27px,5.2vw,65px);font-weight:1000;line-height:1}.sub{font-size:clamp(13px,2vw,23px);color:#f5dada;text-align:center}.panel.green .sub{color:#d8ffdf}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}.controls input{grid-column:1/-1;width:100%;min-width:0;font-size:clamp(22px,3.3vw,38px);font-weight:800;border:3px solid #555;border-radius:15px;background:#222;color:white;padding:clamp(12px,2vh,22px)}.controls button,.history button{border:0;border-radius:14px;padding:clamp(12px,2vh,22px) 14px;font-weight:900;font-size:clamp(20px,3vw,34px);cursor:pointer}.start{background:#f03239;color:#fff}.start:disabled{opacity:.4}.historyToggle{background:#353535;color:#fff}.foot{display:flex;justify-content:space-between;gap:10px;color:#bbb;font-size:clamp(11px,1.6vw,16px);flex-wrap:wrap}.status{color:#ffd38c}.history{display:none;background:#222;padding:14px;border-radius:14px;max-height:36vh;overflow:auto}.history.open{display:block}.history h2{margin:0 0 10px;font-size:20px}.history table{width:100%;border-collapse:collapse}.history td,.history th{padding:8px;border-bottom:1px solid #444;text-align:left}.history button{font-size:15px;background:#555;color:white;margin-top:10px}
@media (orientation:landscape){.app{gap:6px;padding:8px 14px}.stage{min-height:100px}.panel{gap:2px}.digits{font-size:clamp(85px,43vh,380px)}.digits.time{font-size:clamp(55px,18vh,190px)}.light{width:clamp(24px,6vh,65px)}.signal{font-size:clamp(22px,5vh,48px)}.controls{grid-template-columns:1fr 1fr 1fr}.controls input{grid-column:auto}.controls button,.controls input{padding:7px 12px}.flag{font-size:30px}}
@media (max-width:380px){.digits.time{font-size:12.4vw}.brand{font-size:22px}.flag{font-size:22px}}
</style></head><body><main class="app"><header class="top"><div><div class="brand">AKR <b>START</b> TIMER</div><div class="tag">KJS CHRONO SYSTEM · WERSJA TESTOWA</div></div><div class="flag" aria-hidden="true">▨▨▨</div></header><section class="stage"><div class="panel" id="lamp"><div class="hint" id="clockLabel">AKTUALNY CZAS</div><div class="digits time" id="display">--:--:--</div><div class="light" aria-hidden="true"></div><div class="signal" id="signal">CZEKAJ</div><div class="sub" id="crewInfo">Oczekiwanie na załogę</div></div></section><section class="controls"><input id="crew" type="text" inputmode="numeric" autocomplete="off" placeholder="NR ZAŁOGI" aria-label="Numer załogi" maxlength="8"><button class="start" id="start">START · 30 s</button><button class="historyToggle" id="historyToggle">HISTORIA</button></section><div class="foot"><span class="status" id="status">Zapis lokalny · bez połączenia z arkuszem</span><span id="count">Zapisane starty: 0</span></div><section class="history" id="history"><h2>Historia startów (lokalna)</h2><table><thead><tr><th>Załoga</th><th>Data</th><th>Czas startu</th></tr></thead><tbody id="rows"></tbody></table><button id="export">Eksport CSV</button> <button id="clear">Usuń historię</button></section><span id="mode" hidden>GOTOWOŚĆ</span></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='akr_start_timer_test_v1';let state='idle',deadline=0,startEpoch=0,greenUntil=0,crewNumber='',frame=0;const pad=(n,l=2)=>String(n).padStart(l,'0');const formatTime=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;const formatPrecise=d=>`${formatTime(d)}.${pad(d.getMilliseconds(),3)}`;function load(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch{return []}}function store(rows){try{localStorage.setItem(KEY,JSON.stringify(rows));return true}catch{return false}}function renderHistory(){const rows=load();$('count').textContent=`Zapisane starty: ${rows.length}`;$('rows').replaceChildren();for(const r of rows.slice().reverse()){$('rows').insertAdjacentHTML('beforeend',`<tr><td>${escapeHTML(r.crew)}</td><td>${escapeHTML(r.date)}</td><td>${escapeHTML(r.time)}</td></tr>`)}}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function lamp(green){$('lamp').classList.toggle('green',green);$('signal').textContent=green?'START':'CZEKAJ'}function idle(){state='idle';lamp(false);$('mode').textContent='GOTOWOŚĆ';$('clockLabel').textContent='AKTUALNY CZAS';$('display').classList.add('time');$('crewInfo').textContent='Oczekiwanie na załogę';$('crew').value='';$('crew').disabled=false;$('start').disabled=false;$('historyToggle').disabled=false;$('history').classList.remove('open');$('history').style.display='';$('status').textContent='Zapis lokalny · bez połączenia z arkuszem'}function saveStart(){const d=new Date(startEpoch);const r={crew:crewNumber,date:`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,time:formatPrecise(d),timestamp:d.toISOString()};const rows=load();rows.push(r);const ok=store(rows);renderHistory();$('status').textContent=ok?`Zapisano lokalnie: załoga ${crewNumber} · ${r.time}`:'UWAGA: nie udało się zapisać lokalnie!'}function tick(){const now=performance.now();if(state==='idle'){$('display').textContent=formatTime(new Date())}else if(state==='countdown'){const remaining=deadline-now;if(remaining<=0){state='green';greenUntil=deadline+3000;lamp(true);$('mode').textContent='START!';$('display').textContent='00';$('clockLabel').textContent='START';saveStart()}else{$('display').textContent=pad(Math.ceil(remaining/1000))}}else if(state==='green'&&now>=greenUntil){idle()}frame=requestAnimationFrame(tick)}$('start').addEventListener('click',()=>{if(state!=='idle')return;const nr=$('crew').value.trim();if(!/^[0-9]{1,8}$/.test(nr)){alert('Wpisz numer startowy załogi (cyfry).');return}crewNumber=nr;const nowPerf=performance.now();deadline=nowPerf+30000;startEpoch=Date.now()+30000;state='countdown';$('display').classList.remove('time');$('clockLabel').textContent='START ZA';$('crewInfo').textContent=`ZAŁOGA NR ${nr}`;$('mode').textContent='ODLICZANIE';$('crew').disabled=true;$('start').disabled=true;$('historyToggle').disabled=true;$('history').classList.remove('open');lamp(false)});$('historyToggle').addEventListener('click',()=>{$('history').classList.toggle('open');renderHistory()});$('export').addEventListener('click',()=>{const rows=load();const csv='\ufeffNumer załogi;Data;Czas startu;ISO\r\n'+rows.map(r=>`${r.crew};${r.date};${r.time};${r.timestamp}`).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='akr-start-timer-test.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});$('clear').addEventListener('click',()=>{if(confirm('Usunąć całą lokalną historię startów?')){store([]);renderHistory()}});window.addEventListener('beforeunload',e=>{if(state==='countdown'){e.preventDefault();e.returnValue=''}});renderHistory();tick()})();
</script></body></html>
